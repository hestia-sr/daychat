<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DayChat</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--acc:#2563eb;--accfg:#fff;--fg:#fff}
body.light{--fg:#111}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:pan-x pan-y;overscroll-behavior:none}
button,.ns{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:999px;background:none}
svg{display:block}
.bub{background:var(--acc)!important;color:var(--accfg)!important;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.ib{width:44px;height:44px;display:grid;place-items:center}
#wall,#vid,#shade{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#vid{display:none}#shade{background:rgba(255,255,255,.6);display:none}body.light #shade{display:block}
#chat{position:fixed;inset:0;overflow-y:auto;padding:calc(96px + env(safe-area-inset-top)) 16px 130px}
.row{display:flex;margin-bottom:18px;position:relative}.row.u{justify-content:flex-end}
.msg{overflow-wrap:anywhere;min-width:0}
.u .msg{width:fit-content;max-width:85%;background:rgba(38,38,38,.92);color:#fff;border-radius:22px;padding:10px 16px;white-space:pre-wrap}
.a .msg{max-width:100%;font-weight:600;line-height:1.55;text-shadow:0 0 8px rgba(0,0,0,.7),0 0 2px rgba(255,255,255,.35)}
body.light .a .msg{text-shadow:0 0 8px rgba(255,255,255,.9)}
.msg img{display:block;max-width:100%;max-height:300px;border-radius:16px;margin-bottom:8px}
.msg a{color:#38bdf8;text-decoration:underline;word-break:break-all}
.msg code{background:rgba(0,0,0,.45);color:#fff;padding:1px 6px;border-radius:6px;font-weight:400;text-shadow:none}
.hd{font-size:1.1em;font-weight:700;margin:6px 0}
.tip{position:absolute;top:calc(100% - 10px);z-index:5;display:flex;gap:2px;background:#171717;color:#fff;border-radius:999px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.row.u .tip{right:0}.tip button{padding:8px}
.ld{opacity:.7;font-size:14px}
.code{background:#0d1117;border-radius:16px;margin:10px 0;overflow:hidden;text-align:left;font-weight:400;text-shadow:none;color:#e6edf3}
.code .h{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:rgba(255,255,255,.07);font-size:12px;color:rgba(255,255,255,.65)}
.code .h button{background:rgba(255,255,255,.14);color:#fff;padding:5px 12px;font-size:12px;display:flex;gap:6px;align-items:center}
.code .b{max-height:24em;overflow:auto}
.code pre{margin:0;padding:14px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;text-shadow:none}
.k{color:#ff7b72}.s{color:#a5d6ff}.c{color:#8b949e}.n{color:#79c0ff}
#fog{position:fixed;top:0;left:0;right:0;height:calc(100px + env(safe-area-inset-top));z-index:20;pointer-events:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:linear-gradient(rgba(0,0,0,.5),transparent);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
#top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 0}
#mdl{height:44px;padding:0 22px;font-weight:600;font-size:14px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;align-items:flex-end;padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
#bar .ib{width:48px;height:48px;flex:none}
#ta{flex:1;min-height:48px;max-height:160px;resize:none;border:0;outline:0;border-radius:24px;background:rgba(23,23,23,.92);color:#fff;padding:13px 20px;font:16px/22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-y:auto}
#ta::placeholder{color:rgba(255,255,255,.4)}
#chip{position:fixed;left:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;display:none;align-items:center;gap:8px;background:rgba(23,23,23,.95);color:#fff;border-radius:999px;padding:5px 6px 5px 8px;font-size:12px}
#chip img{width:28px;height:28px;border-radius:50%;object-fit:cover}
#chip button{width:26px;height:26px;display:grid;place-items:center;background:rgba(255,255,255,.15)}
#scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.open{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;bottom:0;z-index:50;background:rgba(23,23,23,.96);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;overflow-y:auto;transition:transform .25s ease;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
#left{left:0;width:48%;min-width:190px;transform:translateX(-100%)}
#right{right:0;width:72%;max-width:320px;transform:translateX(100%)}
#sheet{left:0;right:0;top:auto;bottom:0;border-radius:32px 32px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%)}
#left.open,#right.open,#sheet.open{transform:none}
#dd{position:fixed;z-index:50;top:calc(66px + env(safe-area-inset-top));left:50%;margin-left:-90px;width:180px;background:rgba(23,23,23,.96);color:#fff;border-radius:24px;padding:8px;opacity:0;pointer-events:none;transform:translateY(-14px);transition:.2s}
#dd.open{opacity:1;pointer-events:auto;transform:none}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;text-align:left;font-size:14px}
.it:active,.it.on{background:rgba(255,255,255,.14)}
.it .ic{display:grid;place-items:center;width:40px;height:40px}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:22px;font-weight:700}
.logo{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none}
.sec{font-size:13px;opacity:.65;margin:18px 0 8px}
.sw{display:flex;flex-wrap:wrap;gap:8px}.sw button{width:32px;height:32px;border:2px solid transparent}.sw button.on{border-color:#fff}
#search{position:fixed;z-index:50;left:16px;right:16px;top:calc(72px + env(safe-area-inset-top));opacity:0;pointer-events:none;transform:translateY(-20px);transition:.2s}
#search.open{opacity:1;pointer-events:auto;transform:none}
#search input{width:100%;border:0;outline:0;border-radius:999px;background:#171717;color:#fff;padding:13px 20px;font-size:16px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;background:rgba(23,23,23,.96);color:#fff;border-radius:24px;padding:16px;font-size:14px;line-height:1.5;opacity:0;pointer-events:none;transform:translateY(20px);transition:.25s}
#toast.open{opacity:1;pointer-events:auto;transform:none}
</style></head><body>
<div id="wall"></div><video id="vid" autoplay loop muted playsinline></video><div id="shade"></div>
<main id="chat"></main>
<div id="fog"></div>
<header id="top">
  <button class="bub ib ns" id="bMenu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 22 22" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6.5h16M3 15.5h10"/></svg></button>
  <button class="bub ns" id="mdl">Model Ai</button>
  <button class="bub ib ns" id="bSet" aria-label="Pengaturan" data-i="dots"></button>
</header>
<div id="chip" class="ns"><img id="chipImg" alt=""><span id="chipTxt"></span><button id="chipX" aria-label="Batal" data-i="x"></button></div>
<footer id="bar">
  <button class="bub ib ns" id="bPlus" aria-label="Tambah" data-i="plus"></button>
  <textarea id="ta" rows="1" placeholder="Tulis pesan"></textarea>
  <button class="bub ib ns" id="bSend" aria-label="Kirim" data-i="send"></button>
</footer>
<div id="scrim"></div>
<aside id="left" class="panel"></aside>
<aside id="right" class="panel"></aside>
<aside id="sheet" class="panel"></aside>
<div id="dd" class="ns"></div>
<div id="search"><input id="qi" placeholder="Cari pesan"></div>
<div id="toast"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fFile" hidden>
<input type="file" id="fWall" accept="image/jpeg,image/png,video/mp4,video/webm" hidden>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const svg=(d,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={
plus:'<path d="M12 5v14M5 12h14"/>',send:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
dots:'<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
del:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/>',
re:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',
cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
create:'<path d="M16 5h6M19 2v6M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/><circle cx="9" cy="9" r="2"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
smart:'<path d="m12 3 1.9 5.6 5.6 1.9-5.6 1.9L12 18l-1.9-5.6-5.6-1.9 5.6-1.9z"/>',
newm:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M12 7v6M9 10h6"/>',
search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>',
info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',check:'<path d="M20 6 9 17l-5-5"/>',
chain:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>'};
document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=svg(I[e.dataset.i]));
const BADGE='<svg width="18" height="18" viewBox="0 0 24 24" fill="#2563eb" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.78 4.78 4 4 0 0 1-6.74 0 4 4 0 0 1-4.78-4.78 4 4 0 0 1 0-6.75z"/><path d="m9 12 2 2 4-4" fill="none"/></svg>';

/* ---------- Markdown & kode ---------- */
const R1=/(\/\/.*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b\d+\.?\d*\b)|(\b(?:function|const|let|var|return|if|else|for|while|class|import|from|export|default|new|async|await|try|catch|throw|def|in|is|not|and|or|None|True|False|null|undefined|true|false|self|this|public|private|static|void|int|string|echo|fi|then|do|done|elif|end|package|func|fn|use|struct|type)\b)/;
function hl(c,l){
  const src=/^(py|python|sh|bash|shell|zsh|yaml|yml|rb|ruby|toml)$/i.test(l)?R1.source.replace("(\\/\\/","(#.*|\\/\\/"):R1.source;
  const re=new RegExp(src,"g");let o="",i=0,m;
  while((m=re.exec(c))){o+=E(c.slice(i,m.index));o+=`<span class="${m[1]?"c":m[2]?"s":m[3]?"n":"k"}">${E(m[0])}</span>`;i=re.lastIndex;if(!m[0])re.lastIndex++}
  return o+E(c.slice(i));
}
const codeBlock=(l,c)=>`<div class="code"><div class="h"><span class="ns">${E(l||"code")}</span><button class="cc ns">${svg(I.copy,13)}Copy Code</button></div><div class="b"><pre>${hl(c,l)}</pre></div></div>`;
const linkify=t=>t.replace(/(?<!["'>=])(https?:\/\/[^\s<>]*[^\s<>.,;:!?)"'])/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
function md(t){
  const bl=[],il=[];
  t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>{bl.push(codeBlock(l,c.replace(/\n$/,"")));return `\u0000B${bl.length-1}\u0000`});
  t=E(t).replace(/`([^`\n]+)`/g,(_,c)=>{il.push(`<code>${c}</code>`);return `\u0000I${il.length-1}\u0000`});
  t=t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t=linkify(t).replace(/^[-*] /gm,"• ").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/(^|\s)\*([^*\n]+)\*/g,"$1<i>$2</i>");
  t=t.replace(/^#{1,3} (.+)$/gm,'<div class="hd">$1</div>').replace(/\n?(\u0000B\d+\u0000)\n?/g,"$1").replace(/(<\/div>)\n/g,"$1").replace(/\n/g,"<br>");
  return t.replace(/\u0000I(\d+)\u0000/g,(_,i)=>il[i]).replace(/\u0000B(\d+)\u0000/g,(_,i)=>bl[i]);
}

/* ---------- State ---------- */
const chat=$("#chat"),ta=$("#ta");
let msgs=[];try{msgs=JSON.parse(localStorage.getItem("dc")||"[]")}catch{}
let model="otomatis",mode="chat",pend=null,sel=null,q="",stick=true,busy=false,busyImg=false,cur="",seq=0;
const save=()=>{try{localStorage.setItem("dc",JSON.stringify(msgs.map(m=>m.image&&m.image.startsWith("data:")?{...m,image:undefined}:m)))}catch{}};
const add=(role,content,image)=>{msgs.push({id:Date.now()*100+(seq++%100),role,content,image})};
const tb=(a,id,ic)=>`<button data-act="${a}" data-id="${id}" class="ns">${svg(ic,16)}</button>`;
function render(){
  const list=q?msgs.filter(m=>m.content.toLowerCase().includes(q)):msgs;
  chat.innerHTML=list.map(m=>{
    const u=m.role==="user";
    const body=(m.image?`<img src="${E(m.image)}" alt="">`:"")+(u?linkify(E(m.content)):md(m.content));
    const tip=sel===m.id?`<div class="tip">${tb("copy",m.id,I.copy)}${tb("del",m.id,I.del)}${!u&&!m.image?tb("re",m.id,I.re):""}</div>`:"";
    return `<div class="row ${u?"u":"a"}"><div class="msg" data-id="${m.id}">${body}</div>${tip}</div>`;
  }).join("")+(busy?'<div class="ld ns">'+(busyImg?"Memproses gambar, bisa 10 sampai 60 detik...":"Menulis...")+"</div>":"");
  if(stick)chat.scrollTop=chat.scrollHeight;
  save();
}
chat.addEventListener("scroll",()=>{stick=chat.scrollHeight-chat.scrollTop-chat.clientHeight<80});
const copy=t=>{if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t);else{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}};
chat.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");
  if(a){const id=+a.dataset.id,i=msgs.findIndex(m=>m.id===id);sel=null;
    if(a.dataset.act==="copy")copy(msgs[i].content);
    if(a.dataset.act==="del")msgs.splice(i,1);
    if(a.dataset.act==="re"){msgs=msgs.slice(0,i);stick=true;askChat();return}
    render();return}
  const cc=e.target.closest(".cc");
  if(cc){copy(cc.closest(".code").querySelector("pre").textContent);cc.innerHTML=svg(I.check,13)+"Tersalin";setTimeout(()=>cc.innerHTML=svg(I.copy,13)+"Copy Code",1500);return}
  if(e.target.closest("a"))return;
  const m=e.target.closest(".msg");sel=m&&sel!==+m.dataset.id?+m.dataset.id:null;render();
});

/* ---------- API ---------- */
async function api(url,body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const m=d.error;throw new Error(typeof m==="string"?m:m?.message||"gagal")}
  return d;
}
async function askChat(){
  busy=true;render();
  try{const d=await api("/api/chat",{model,messages:msgs.filter(m=>m.content).map(({role,content})=>({role,content}))});add("assistant",d.text||"(kosong)")}
  catch(e){add("assistant","Permintaan gagal: "+e.message)}
  busy=false;render();
}
async function makeImg(prompt,image){
  const d=await api("/api/image",{prompt,image});
  const s=d.url||d.image_url||d.image||d.data?.[0]?.url||d.data?.[0]?.b64_json||d.output?.[0];
  if(!s)throw new Error("respons tidak berisi gambar");
  return /^(https?:|data:)/.test(s)?s:"data:image/png;base64,"+s;
}
async function send(){
  const t=ta.value.trim();if(!t||busy)return;
  if(mode==="edit"&&!pend){toast("Pilih gambar dulu lewat tombol +");return}
  stick=true;const im=mode==="edit"?pend:undefined;
  add("user",t,im);ta.value="";fit();
  if(mode==="chat"){await askChat();return}
  busy=true;busyImg=true;render();
  try{add("assistant","",await makeImg(t,im))}catch(e){add("assistant","Gambar gagal diproses: "+e.message)}
  busy=false;busyImg=false;if(mode==="edit")setMode("chat");render();
}
function setMode(m,img){
  mode=m;pend=img||null;
  $("#chip").style.display=m==="chat"?"none":"flex";
  $("#chipImg").style.display=pend?"block":"none";if(pend)$("#chipImg").src=pend;
  $("#chipTxt").textContent=m==="edit"?"Edit Gambar":"Buat Gambar";
  ta.placeholder=m==="edit"?"Jelaskan perubahan gambar":m==="create"?"Jelaskan gambar yang dibuat":"Tulis pesan";
}
$("#chipX").onclick=()=>setMode("chat");
const fit=()=>{ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,160)+"px";$("#chip").style.bottom=$("#bar").offsetHeight+8+"px"};
ta.addEventListener("input",fit);$("#bSend").onclick=send;
async function shrink(u,max=1280){ // kecilkan foto HP agar di bawah batas 10 MB deAPI
  const im=new Image();im.src=u;await im.decode();
  const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.9);
}
const readFile=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});

/* ---------- Overlay ---------- */
const scrim=$("#scrim");
function open(n){close();cur=n;$("#"+n).classList.add("open");scrim.classList.add("open")}
function close(){if(!cur)return;$("#"+cur).classList.remove("open");scrim.classList.remove("open");if(cur==="search"){q="";$("#qi").value="";render()}cur=""}
scrim.onclick=close;
function drag(el,dir){
  let x0,y0,v=0,on=false;const ax=dir==="left"||dir==="right";
  el.addEventListener("touchstart",e=>{const t=e.touches[0];x0=t.clientX;y0=t.clientY;v=0;on=true},{passive:true});
  el.addEventListener("touchmove",e=>{if(!on)return;const t=e.touches[0],dx=t.clientX-x0,dy=t.clientY-y0;
    v=dir==="left"?Math.min(0,dx):dir==="right"?Math.max(0,dx):dir==="down"?Math.max(0,dy):Math.min(0,dy);
    if(Math.abs(v)>8){el.style.transition="none";el.style.transform=ax?`translateX(${v}px)`:`translateY(${v}px)`}},{passive:true});
  el.addEventListener("touchend",()=>{on=false;el.style.transition="";el.style.transform="";if(Math.abs(v)>70)close()});
}
[["#left","left"],["#right","right"],["#sheet","down"],["#dd","up"]].forEach(([s,d])=>drag($(s),d));
let tt;function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("open");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("open"),7000)}
$("#toast").onclick=()=>$("#toast").classList.remove("open");

/* ---------- Sidebar kiri ---------- */
